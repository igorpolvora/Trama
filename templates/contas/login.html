<!DOCTYPE html>
<html lang="pt-BR">
  <body>
    <h1>Entrar</h1>
    {% if messages %}
      <ul>
        {% for message in messages %}
          <li>{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label>Usuário
        <input type="text" name="username">
      </label><br>
      <label>Senha
        <input type="password" name="password">
      </label><br>
      <button type="submit">Entrar</button>
    </form>
    <p><a href="{% url 'cadastro' %}">Criar conta</a></p>
  </body>
</html>
